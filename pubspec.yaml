name: maanthirigam
description: Maanthirigam mobile application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.1
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.1
  razorpay_flutter: ^1.3.7
  package_info_plus: ^7.0.0
  url_launcher: ^6.2.6
  cached_network_image: ^3.3.1
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  share_plus: 10.0.0
  # Flutter 3.19.3 / Dart 3.3.x compatible PDFium viewer.
  # Do not float to 2.x (requires a newer Flutter toolchain).
  # 1.0.85+ pulls path_provider >=2.1.5 (Dart >=3.4).
  pdfrx: 1.0.84
  # Direct dep: PDF temp cleanup; also pulled transitively by pdfrx 1.0.84.
  path_provider: 2.1.4

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/covers/
    - assets/icons/
    # TEMP Phase 1.2 transparency verification only — revert after Android QA.
    - assets/debug/phase1_1-five-pages-transparent.pdf

