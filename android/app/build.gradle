plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// App Links host/path for shared book URLs, taken from the same
// APP_SHARE_BASE_URL dart-define the Dart code uses. Without it the filter
// points at the reserved, never-resolving "share.invalid" host.
def dartDefines = [:]
if (project.hasProperty('dart-defines')) {
    project.property('dart-defines').toString().split(',').each { entry ->
        try {
            def pair = new String(entry.decodeBase64(), 'UTF-8').split('=', 2)
            if (pair.length == 2) dartDefines[pair[0]] = pair[1]
        } catch (ignored) {
        }
    }
}
def shareHost = 'share.invalid'
def sharePathPrefix = '/book/'
try {
    def shareBase = (dartDefines['APP_SHARE_BASE_URL'] ?: '').toString().trim()
    if (shareBase) {
        def shareUri = new URI(shareBase)
        if (shareUri.scheme == 'https' && shareUri.host) {
            shareHost = shareUri.host
            sharePathPrefix = (shareUri.path ?: '').replaceAll('/+$', '') + '/book/'
        }
    }
} catch (ignored) {
}

android {
    namespace "com.maanthirigam.maanthirigam"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.maanthirigam.maanthirigam"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        // firebase_auth requires API 23+.
        minSdkVersion 23
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        manifestPlaceholders += [shareHost: shareHost, sharePathPrefix: sharePathPrefix]
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Google Play Install Referrer: deferred book links after a Play install.
    implementation 'com.android.installreferrer:installreferrer:2.2'
}
